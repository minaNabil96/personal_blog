<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090b"/>
      <stop offset="50%" style="stop-color:#18181b"/>
      <stop offset="100%" style="stop-color:#09090b"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="white" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="1000" cy="150" r="200" fill="url(#accentGradient)" opacity="0.1"/>
  <circle cx="200" cy="500" r="150" fill="#3b82f6" opacity="0.08"/>
  <circle cx="1100" cy="550" r="100" fill="#06b6d4" opacity="0.06"/>
  
  <!-- Logo area -->
  <g transform="translate(600, 200)">
    <rect x="-60" y="-60" width="120" height="120" rx="24" fill="url(#accentGradient)"/>
    <path d="M-20 0 L0 30 L40 -30" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="0" cy="0" r="16" stroke="white" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Text -->
  <text x="600" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">Mina&apos;s tech</text>
  <text x="600" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#71717a">Programming, Technology & AI</text>
  
  <!-- Bottom accent -->
  <g transform="translate(600, 530)">
    <rect x="-100" y="-2" width="200" height="4" rx="2" fill="url(#accentGradient)" opacity="0.5"/>
  </g>
</svg>